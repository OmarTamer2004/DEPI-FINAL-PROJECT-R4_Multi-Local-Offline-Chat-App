# ─────────────────────────────────────────────
# GROQ API CONFIGURATION
# (replaces the old local CTransformers / GGUF model_path & model_type)
# ─────────────────────────────────────────────
# API key resolution order (see llm_chains.py -> _get_groq_api_key()):
#   1. GROQ_API_KEY environment variable
#   2. st.secrets["GROQ_API_KEY"]  (Streamlit Cloud secrets.toml)
#   3. groq_api_key below (fallback so the app runs out-of-the-box)
groq_api_key: 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

# Default model used when the sidebar "Active Model" selector hasn't
# been changed yet.
groq_model: llama-3.1-8b-instant

# Models shown in the sidebar "Active Model" dropdown. Selecting one
# actually switches the model used for generation (see app.py
# load_chain() -> llm_chains.create_llm(model_name=...)).
available_models:
  - llama-3.1-8b-instant
  - llama-3.3-70b-versatile

# Generation parameters passed straight to ChatGroq. (context_length /
# gpu_layers from the old CTransformers config are no longer relevant
# since Groq hosts the model — max_new_tokens is renamed to the
# OpenAI/Groq-style "max_tokens".)
model_config:
  temperature: 0
  max_tokens: 512

